# configs/gen_examples.yaml
# Galaxias a generar en un job. Cada entrada produce un PNG y un grid final.
# 'checkpoint: null' deja que submit_gen.sh autodescubra el mejor modelo.
# Los valores están en unidades físicas reales, no normalizados [0, 1].

# Ruta al checkpoint .pt; null permite que submit_gen.sh use mejor_modelo.pt.
checkpoint: null
# Directorio de salida; null usa OUTPUT_DIR definido por el job Slurm.
output_dir: null
# Tamaño cuadrado de imagen a generar; debe coincidir con el entrenamiento.
img_size: 128
# Número de pasos DDIM de denoising; más pasos suele ser más lento y estable.
inference_steps: 100
# Fuerza del classifier-free guidance; 1.0 equivale a sin guidance.
guidance_scale: 7.5
# Modo de generación: examples usa esta lista; sweep barre una variable.
mode: examples
# Semilla base para reproducibilidad; cada ejemplo suma su índice.
seed: 42

# Lista de especificaciones físicas a generar.
galaxies:
  - etiqueta: 01_tipica_mediana
    # Escala angular física en kpc por píxel; null deja esta variable sin condicionar.
    escala_kpc_px: 0.90
    # Masa estelar log10(M_sol); null deja esta variable sin condicionar.
    log_ms: 10.2
    # Edad estelar en Gyr; null deja esta variable sin condicionar.
    ea_gyr: 1.4
    # Radio Petrosian en arcsec; null deja esta variable sin condicionar.
    radio_p_arcsec: 9.0

  - etiqueta: 02_baja_masa_joven_compacta
